<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parent VR Control Portal</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    input {
      background: #0f172a;
      border: 1px solid #475569;
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 1.2rem;
      width: 140px;
      letter-spacing: 4px;
      text-align: center;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }

    button:hover {
      background: #1d4ed8;
    }

    button.secondary {
      background: #334155;
    }

    button.active {
      background: #059669;
    }

    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #020617;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .stats {
      display: flex;
      gap: 24px;
      font-size: 1.1rem;
      color: #38bdf8;
      font-weight: 700;
    }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>

<body>
  <h1>Parent VR Control Portal</h1>

  <div class="card row">
    <input id="codeInput" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="1234" />
    <button id="connectBtn">Connect to Headset</button>
    <span id="connStatus" style="color:#94a3b8;">Not connected</span>
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between; margin-bottom: 12px;">
      <strong>Live Headset Mirror</strong>
      <div class="stats">
        <span>Score: <span id="scoreVal">0</span></span>
        <span id="stateVal">Playing</span>
      </div>
    </div>
    <video id="mirrorVideo" autoplay playsinline muted></video>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Switch Game</h3>
    <div class="row" style="margin-bottom: 16px;">
      <button class="game-btn active" data-game="whackAMole">Whack-a-Mole (Garden)</button>
      <button class="game-btn" data-game="starCatcher">Star Catcher (Space)</button>
      <button class="game-btn" data-game="bubblePop">Rainbow Bubbles (Meadow)</button>
    </div>

    <h3>Session Controls</h3>
    <div class="row">
      <button class="secondary" id="pauseBtn">Pause / Resume</button>
      <button class="secondary" id="recenterBtn">Recenter View</button>
      <button class="secondary speed-btn" data-speed="0.7">Slow Speed</button>
      <button class="secondary speed-btn" data-speed="1.0">Normal Speed</button>
      <button class="secondary speed-btn" data-speed="1.4">Fast Speed</button>
    </div>
  </div>

  <script>
    const peer = new Peer({
      host: window.location.hostname,
      port: window.location.port || (window.location.protocol === 'https:' ? 443 : 80),
      path: '/peerjs/myapp',
      secure: window.location.protocol === 'https:'
    });
    let conn = null;

    peer.on('call', (call) => {
      call.answer();
      call.on('stream', (remoteStream) => {
        const video = document.getElementById('mirrorVideo');
        video.srcObject = remoteStream;
      });
    });

    document.getElementById('connectBtn').addEventListener('click', () => {
      const code = document.getElementById('codeInput').value.trim();
      if (code.length !== 4) return;

      document.getElementById('connStatus').textContent = 'Connecting...';
      conn = peer.connect(`vr-kids-${code}`);

      conn.on('open', () => {
        document.getElementById('connStatus').textContent = `Connected to Room ${code}`;
        document.getElementById('connStatus').style.color = '#34d399';
      });

      conn.on('data', (msg) => {
        if (msg.type === 'TELEMETRY') {
          document.getElementById('scoreVal').textContent = msg.score;
          document.getElementById('stateVal').textContent = msg.paused ? 'Paused' : 'Playing';
        }
      });
    });

    document.querySelectorAll('.game-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (!conn) return;
        document.querySelectorAll('.game-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        conn.send({ type: 'LOAD_GAME', gameKey: btn.dataset.game });
      });
    });

    document.querySelectorAll('.speed-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (!conn) return;
        conn.send({ type: 'SET_SPEED', value: parseFloat(btn.dataset.speed) });
      });
    });

    document.getElementById('pauseBtn').addEventListener('click', () => {
      if (conn) conn.send({ type: 'TOGGLE_PAUSE' });
    });

    document.getElementById('recenterBtn').addEventListener('click', () => {
      if (conn) conn.send({ type: 'RECENTER' });
    });
  </script>
</body>

</html>
